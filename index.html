<!doctype html>
<html lang="ko">

<title>남강중 원의 성질 방탈출</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;800&display=swap">
<style>
:root{
  /* layout: one-screen game. chalkboard HUD strip, canvas stage, control strip; overlays are school paper (시험지, 표창장) */
  --bg:#e9f0ea;--panel:#fbfdfb;--ink:#1c2a23;--muted:#5a6d63;--line:#c5d3ca;
  --board:#24543f;--board-ink:#f1f6f0;--chalk:#ffd54a;--good:#1c8656;--bad:#c23b3b;
  --paper:#fffdf4;--paper-ink:#1d2622;--paper-rule:#2a3c8f;--gold:#b88a1e;
  --display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --exam:'Nanum Myeongjo','Batang','AppleMyungjo',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c17;--panel:#1a2a23;--ink:#e6efe9;--muted:#9ab0a4;--line:#2e453a;--board:#1f4a38;--board-ink:#f1f6f0;--chalk:#ffd54a;--good:#4cc48d;--bad:#f07a7a;--paper:#f4f1e4;--paper-ink:#1d2622;--paper-rule:#2a3c8f;--gold:#b88a1e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101c17;--panel:#1a2a23;--ink:#e6efe9;--muted:#9ab0a4;--line:#2e453a;--board:#1f4a38;--board-ink:#f1f6f0;--chalk:#ffd54a;--good:#4cc48d;--bad:#f07a7a;--paper:#f4f1e4;--paper-ink:#1d2622;--paper-rule:#2a3c8f;--gold:#b88a1e;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:10px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:1100px;margin-inline:auto}
.hud{background:var(--board);color:var(--board-ink);border-radius:6px;padding:8px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;border-bottom:4px solid #a57b4b}
.hud h1{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;color:var(--chalk);letter-spacing:.02em;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9rem;margin-left:auto;font-variant-numeric:tabular-nums}
.chips b{color:var(--chalk);font-weight:400;font-family:var(--display);font-size:1rem}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas#cv{display:block;border-radius:6px;background:#333;image-rendering:auto;touch-action:none}
.ctl{display:flex;align-items:center;gap:12px}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px;flex:none}
.pad button,#act{font:inherit;font-family:var(--display);border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active,#act:active{background:var(--chalk);color:#1c2a23}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
#prompt{flex:1;min-width:0;margin:0;text-align:center;color:var(--muted);font-size:.95rem}
#prompt b{color:var(--ink)}
#act{width:84px;height:84px;border-radius:50%;font-size:1.5rem;flex:none;background:var(--chalk);color:#1c2a23;border-color:#a57b4b}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.ov{position:fixed;inset:0;background:rgba(10,20,15,.62);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:5}
.card{background:var(--panel);color:var(--ink);border-radius:8px;width:100%;max-width:560px;padding:22px;margin-block:auto;display:flex;flex-direction:column;gap:14px;border-top:6px solid var(--board);min-width:0}
.card.wide{max-width:760px}
.card h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;line-height:1.2;text-wrap:balance}
.card p{margin:0}
.eyebrow{font-size:.85rem;color:var(--muted);letter-spacing:.04em}
.tag{display:inline-block;background:var(--chalk);color:#1c2a23;border-radius:4px;padding:0 6px;font-size:.8rem;margin-left:6px}
.q{font-size:1.15rem;line-height:1.6;word-break:keep-all}
.mask{color:var(--muted);letter-spacing:-.05em}
.qimg{max-width:100%;max-height:240px;align-self:center;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:10px 12px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer;display:flex;gap:10px}
.opt[aria-pressed="true"]{border-color:var(--board);background:var(--chalk);color:#1c2a23}
.opt i{color:var(--muted);font-style:normal}
.opt[aria-pressed="true"] i{color:#4a4020}
.field{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-family:var(--display);font-size:1.1rem;padding:9px 18px;border-radius:8px;border:2px solid var(--board);background:var(--board);color:var(--board-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--chalk);color:#1c2a23;border-color:#a57b4b}
.note{font-size:.9rem;color:var(--muted)}
.ok{color:var(--good);font-family:var(--display);font-size:1.4rem}
.no{color:var(--bad);font-family:var(--display);font-size:1.4rem}
.say{font-size:1.15rem;border-left:4px solid var(--chalk);padding-left:12px}
.how{margin:0;padding-left:1.1em;font-size:.92rem;color:var(--muted)}
details.teacher{border-top:1px solid var(--line);padding-top:10px;font-size:.92rem}
details.teacher summary{cursor:pointer;color:var(--muted)}
details.teacher ol{padding-left:1.2em;margin:8px 0}
label.lb{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
/* 시험지 */
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--exam);border-top:0;border:2px solid var(--paper-ink);border-radius:2px;padding:20px}
.paper .head{border:2px solid var(--paper-ink);display:grid;grid-template-columns:1fr auto;text-align:center}
.paper .head strong{font-size:1.25rem;padding:10px;letter-spacing:.1em}
.paper .head span{border-left:2px solid var(--paper-ink);padding:10px 14px;font-size:.9rem;display:flex;align-items:center}
.paper .xq{border-top:1px solid #b9b39c;padding-top:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.paper .xq.wrong .num{color:#c23b3b}
.paper .num{font-weight:800;margin-right:4px}
.paper label.o{display:flex;gap:8px;align-items:baseline}
.paper .field{background:#fff;color:var(--paper-ink);border-color:#8d8770;max-width:260px;font-family:var(--exam)}
.paper .btn{font-family:var(--exam);font-weight:800;background:var(--paper-ink);border-color:var(--paper-ink);color:#fff}
.paper .rv{font-size:.92rem;color:#3c463f}
.paper .t0{color:#1c8656;font-weight:800}.paper .t1{color:#c23b3b;font-weight:800}
/* 표창장 */
.cert{max-width:min(560px,calc(100% - 36px));background:var(--paper);color:var(--paper-ink);font-family:var(--exam);border:3px double var(--gold);outline:8px solid var(--paper);box-shadow:0 0 0 10px var(--gold);border-radius:0;text-align:center;padding:36px 24px;position:relative;overflow:hidden;margin-block:auto}
.cert h2{font-family:var(--exam);font-weight:800;font-size:2.4rem;letter-spacing:.5em;text-indent:.5em}
.cert .nm{font-size:1.5rem;font-weight:800;border-bottom:1px solid var(--paper-ink);align-self:center;padding:0 24px 4px}
.cert .btn{align-self:center;font-family:var(--exam);font-weight:800;background:var(--paper-ink);border-color:var(--paper-ink);color:#fff;position:relative}
.cert canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cert>*:not(canvas){position:relative}
@media (max-width:560px){.hud h1{font-size:1.1rem}.chips{margin-left:0;font-size:.82rem}#act{width:68px;height:68px}#prompt{font-size:.85rem}.card{padding:16px}.cert h2{font-size:1.8rem}}
</style>
<div id="app">
  <header class="hud"><h1 id="ttl">학교 탈출</h1><div class="chips"><span>위치 <b id="loc">운동장</b></span><span>푼 문제 <b id="prog">0 / 0</b></span><span>보물상자 <b id="box">잠김</b></span><span id="who"></span></div></header>
  <main class="stage" id="stage"><canvas id="cv" width="1280" height="768" aria-label="학교 지도"></canvas></main>
  <footer class="ctl">
    <div class="pad" aria-label="이동"><button class="u" data-d="up" aria-label="위">▲</button><button class="l" data-d="left" aria-label="왼쪽">◀</button><button class="d" data-d="down" aria-label="아래">▼</button><button class="r" data-d="right" aria-label="오른쪽">▶</button></div>
    <p id="prompt">방향키 또는 W A S D 로 이동, E 로 살펴보기</p>
    <button id="act" aria-label="살펴보기">E</button>
  </footer>
</div>
<div id="ov" class="ov" hidden><div class="card" id="card"></div></div>
<script>
'use strict';
const T=32,W=20,H=12,NUM='①②③④⑤',STEP=130;
const DEFAULT={cfg:{title:'남강중학교 방탈출',finalQ:'이차함수 y=(x−1)²+4 의 그래프에서 꼭짓점의 x좌표와 y좌표를 더한 값은 얼마일까?',pass:'5',success:'위 학생은 이차함수, 삼각비, 원의 성질 문제를 모두 풀고 학교 탈출에 성공하였으므로 이 상장을 수여합니다.',group:'',penalty:2},probs:[
{g:0,q:'이차함수 y = 2x² 의 그래프가 점 (2, a)를 지날 때, a의 값은?',a:'3',o:['4','6','8','16'],e:'x = 2를 대입하면 a = 2 × 2² = 8',n:['x 자리에 2를 넣어 보면 되지 않을까?','제곱을 먼저 계산해야 해.','2 × 4는 얼마더라?']},
{g:0,q:'이차함수 y = (x − 3)² + 2 의 그래프의 꼭짓점의 좌표는?',a:'2',o:['(−3, 2)','(3, 2)','(3, −2)','(2, 3)'],e:'y = a(x − p)² + q 의 꼭짓점은 (p, q)이므로 (3, 2)',n:['괄호 안이 0이 되는 x를 찾아봐.','y = a(x − p)² + q 꼴이면 꼭짓점은 (p, q)야.','부호를 조심해. x − 3 이잖아.']},
{g:0,q:'y = x² − 4x + 7 을 y = (x − p)² + q 꼴로 고칠 때, p + q 의 값은?',a:'5',o:[],e:'y = (x² − 4x + 4) + 3 = (x − 2)² + 3 이므로 p = 2, q = 3, p + q = 5',n:['x의 계수 −4의 절반을 제곱해 봐.','4를 더하고 다시 4를 빼면 완전제곱식이 보여.','7 = 4 + 3 이지.']},
{g:0,q:'이차함수 y = −2(x + 1)² + 5 의 그래프에 대한 설명으로 옳은 것을 모두 고르면?',a:'13',o:['위로 볼록하다','꼭짓점의 좌표는 (1, 5)이다','축의 방정식은 x = −1 이다','y = 2x² 의 그래프보다 폭이 넓다','y축과 만나는 점의 y좌표는 5이다'],e:'x² 의 계수가 음수이므로 위로 볼록하고, 꼭짓점은 (−1, 5), 축은 x = −1. 폭은 |a| = 2로 같고, x = 0일 때 y = 3.',n:['답이 하나가 아니야. 두 개를 골라야 해.','x = 0을 넣으면 y가 얼마인지 직접 계산해 봐.','폭은 x² 앞의 수의 절댓값이 정해.']},
{g:1,q:'이차함수 y=3x² 의 그래프를 x축의 방향으로 2만큼, y축의 방향으로 −4만큼 평행이동한 그래프의 식은?',a:'3',o:['y=3(x+2)²−4','y=3(x−2)²+4','y=3(x−2)²−4','y=3(x+2)²+4'],e:'x축 방향으로 p, y축 방향으로 q만큼 평행이동하면 y = a(x − p)² + q. 따라서 y = 3(x − 2)² − 4',n:['이건 모둠 문제야. 친구들 화면을 다 모아야 문제가 보여.','x축 방향으로 p만큼 옮기면 x 대신 x − p 를 써.','y축 방향 이동은 식 끝에 그대로 더해.']},
{g:0,q:'sin 30° + cos 60° 의 값은?',a:'1',o:[],e:'sin 30° = 1/2, cos 60° = 1/2 이므로 합은 1',n:['30°, 60°, 90° 삼각자를 떠올려 봐.','sin 30° 와 cos 60° 는 값이 같아.','반과 반을 더하면?']},
{g:0,q:'∠C = 90°인 직각삼각형 ABC에서 AB = 5, BC = 3, CA = 4일 때, sin A 의 값은?',a:'3',o:['3/4','4/5','3/5','4/3'],e:'sin A = (∠A의 대변) / (빗변) = BC / AB = 3/5',n:['빗변은 직각의 맞은편 변이야.','sin 은 높이를 빗변으로 나눈 값이야.','∠A와 마주 보는 변이 어느 변이지?']},
{g:0,q:'나무에서 10 m 떨어진 지점에서 나무 꼭대기를 올려다본 각의 크기가 60°였다. 눈높이를 무시할 때, 나무의 높이는?',a:'1',o:['10√3 m','5√3 m','20 m','10 m'],e:'높이 = 10 × tan 60° = 10√3 (m)',n:['밑변과 높이의 관계니까 tan 을 쓰면 돼.','tan 60° 는 √3 이야.','그림을 그리면 직각삼각형이 보여.']},
{g:0,q:'두 변의 길이가 6 cm, 8 cm이고 그 끼인각의 크기가 30°인 삼각형의 넓이는 몇 cm²인가? (숫자만 입력)',a:'12/12cm²/12cm2',o:[],e:'½ × 6 × 8 × sin 30° = ½ × 48 × ½ = 12 (cm²)',n:['넓이 = ½ × a × b × sin C 야.','sin 30° 는 ½ 이지.','48의 반의 반은?']},
{g:1,q:'반지름의 길이가 5cm인 원에서 원의 중심으로부터 3cm 떨어진 현의 길이는?',a:'3',o:['4cm','6cm','8cm','10cm'],e:'중심에서 현에 내린 수선은 현을 이등분한다. 현의 절반 = √(5² − 3²) = 4 이므로 현의 길이는 8 cm',n:['모둠 문제야. 친구들이 가진 조각을 모아 봐.','중심에서 현에 내린 수선은 현을 이등분해.','3, 4, 5 직각삼각형이 숨어 있어.']},
{g:0,q:'한 원에서 어떤 호에 대한 중심각의 크기가 110°일 때, 그 호에 대한 원주각의 크기는 몇 도인가? (숫자만 입력)',a:'55/55도/55°',o:[],e:'원주각의 크기는 중심각의 크기의 ½이므로 55°',n:['원주각은 중심각의 절반이야.','110을 2로 나누면?','같은 호를 보고 있다는 게 중요해.']},
{g:0,q:'원 O의 반지름의 길이가 5 cm이고, 원 밖의 한 점 P에서 중심 O까지의 거리가 13 cm이다. 점 P에서 원 O에 그은 접선의 길이는 몇 cm인가? (숫자만 입력)',a:'12/12cm',o:[],e:'접선은 접점을 지나는 반지름과 수직이므로 접선의 길이 = √(13² − 5²) = √144 = 12 (cm)',n:['접선과 반지름은 접점에서 수직으로 만나.','피타고라스 정리를 쓰면 돼.','5, 12, 13 이라는 수가 떠오르지 않아?']},
{g:0,q:'원에 내접하는 사각형 ABCD에서 ∠A = 75°일 때, ∠C 의 크기는 몇 도인가? (숫자만 입력)',a:'105/105도/105°',o:[],e:'원에 내접하는 사각형에서 마주 보는 두 각의 크기의 합은 180°이므로 ∠C = 180° − 75° = 105°',n:['마주 보는 두 각을 더하면 180°야.','180에서 75를 빼면 돼.','∠A와 ∠C는 서로 마주 보는 각이야.']}
]};

/* ---------- 채점 · 모둠 조각 ---------- */
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[\s.]/g,'');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function correctSet(p){const a=String(p.a).trim(),n=p.o.length,r=new Set();if(!a)return r;
  if(/^[1-5]+$/.test(a)&&[...a].every(d=>+d<=n)){[...a].forEach(d=>r.add(+d-1));return r}
  if([...a].every(c=>NUM.includes(c))){[...a].forEach(c=>{const k=NUM.indexOf(c);if(k<n)r.add(k)});return r}
  const k=p.o.findIndex(t=>norm(t)===norm(a));if(k>=0)r.add(k);return r}
function grade(p,v){if(p.o.length){const c=correctSet(p);return c.size>0&&v.size===c.size&&[...c].every(k=>v.has(k))}
  const t=norm(v);return t!==''&&String(p.a).split('/').some(x=>norm(x)===t)}
function pieces(text,n){let tok=String(text).trim().split(/\s+/),sep=' ';if(tok.length<n){tok=[...String(text).replace(/\s+/g,'')];sep=''}
  return{sep,out:tok.map((t,i)=>({t,r:Math.min(n-1,Math.floor(i*n/tok.length))}))}}
function maskHTML(text,n,role){const p=pieces(text,n);return p.out.map(o=>o.r===role-1?'<b>'+esc(o.t)+'</b>':'<span class="mask">'+'▒'.repeat(Math.min(4,Math.max(1,[...o.t].length)))+'</span>').join(p.sep)}
function driveImg(u){const m=/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/.exec(u);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':u}
function parseProbs(rows){return rows.slice(1).filter(r=>r[1]).slice(0,25).map(r=>({g:/모둠/.test(r[0]||'')?1:0,q:r[1],a:r[2]||'',o:r.slice(3,8).filter(Boolean),e:r[8]||'',img:r[9]?driveImg(r[9]):'',n:r.slice(10,13).filter(Boolean)}))}
function parseCfg(rows){const c=Object.assign({},DEFAULT.cfg,{success:'축하합니다. 모든 문제를 풀고 학교 탈출에 성공했습니다.'});rows.forEach(r=>{const k=r[0]||'',v=(r[1]||'').trim();if(!v)return;
